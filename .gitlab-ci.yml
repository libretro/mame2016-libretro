# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

# Core definitions
.core-defs:
  variables:
    MAKEFILE: Makefile.libretro
    CORENAME: mame2016
    REGENIE: 0

# Inclusion templates, required for the build to work
include:
  ################################## DESKTOPS ################################
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-x64-mingw.yml'

  # Windows 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-i686-mingw.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-x64.yml'

  # Linux 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-i686.yml'

  # Linux ARM 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-aarch64.yml'

  # MacOS 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-x64.yml'

  # MacOS ARM 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-arm64.yml'

  # iOS arm64
  - project: 'libretro-infrastructure/ci-templates'
    file: '/ios-arm64.yml'

  # tvOS arm64
  - project: 'libretro-infrastructure/ci-templates'
    file: '/tvos-arm64.yml'

  ################################## CELLULAR ################################
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-make.yml'

  #################################### MISC ##################################
  # webOS 32-bit (LGTV)
  - project: 'libretro-infrastructure/ci-templates'
    file: '/webos-make.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

# Cache, referenced by the macOS jobs
.osx-cache: &osx_cache
  untracked: true
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  when: always
  paths:
    - build/

##############################################################################
#################################### STAGES ##################################
##############################################################################
#
################################### DESKTOPS #################################
# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs

# Windows 32-bit
libretro-build-windows-i686:
  extends:
    - .libretro-windows-i686-mingw-make-default
    - .core-defs
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-mxe-win-cross-cores:gcc14

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs

# Linux 32-bit
libretro-build-linux-i686:
  extends:
    - .libretro-linux-i686-make-default
    - .core-defs
  image: $CI_SERVER_HOST:5050/libretro-infrastructure/libretro-build-i386-ubuntu:backports

# Linux ARM 64-bit
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs

# MacOS 64-bit
#
# A full MAME build does not fit in the one hour a job gets by default, and
# the mac runners hand the build a fifth of their cores. The cache only helps
# when the next pipeline lands on the same runner - the shell executor keeps
# it locally - and a job killed by the timeout never uploads one at all, so
# the x64 job had never once finished. Three hours is enough: it was 55
# minutes in when it was cut off, against 20 for arm64.
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs
  timeout: 3h
  cache:
    <<: *osx_cache

# MacOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs
  timeout: 3h
  cache:
    <<: *osx_cache

# iOS arm64
libretro-build-ios-arm64:
  extends:
    - .libretro-ios-arm64-make-default
    - .core-defs
  timeout: 3h
  cache:
    <<: *osx_cache

# tvOS arm64
libretro-build-tvos-arm64:
  extends:
    - .libretro-tvos-arm64-make-default
    - .core-defs
  timeout: 3h
  cache:
    <<: *osx_cache

################################### CELLULAR #################################
# Android, the two ARM ABIs.
#
# No x86 ones: MAME's x86 recompiler backends do not compile against bionic,
# whose <sys/ucontext.h> puts REG_EAX and friends in the global namespace,
# where they collide with x86emit's ("reference to 'REG_EAX' is ambiguous").
# The x86_64 job that used to be here never cross-compiled anyway: it built a
# host x86_64 Linux core and uploaded nothing.
#
# Three hours, like the macOS jobs - a full build is about an hour on four
# cores, and the runner hands the build a fifth of its own.
android-armeabi-v7a:
  extends:
    - .libretro-android-make-armeabi-v7a
    - .core-defs
  timeout: 3h

# Android ARMv8a
android-arm64-v8a:
  extends:
    - .libretro-android-make-arm64-v8a
    - .core-defs
  timeout: 3h

# Android x86
android-x86:
  extends:
    - .libretro-android-make-x86
    - .core-defs
  timeout: 3h

# Android x86_64
android-x86_64:
  extends:
    - .libretro-android-make-x86_64
    - .core-defs
  timeout: 3h

#################################### MISC ##################################
# webOS 32-bit
#
# The SDK's toolchain builds the unix target; Makefile.libretro already knows
# the arm-webos-linux-gnueabi prefix and picks 32-bit pointers and the C DRC
# backend from it. Three hours because the webOS runner is not fast and this
# does not fit in one, same as the macOS jobs.
libretro-build-webos-armv7a:
  extends:
    - .libretro-webos-armv7a-make-default
    - .core-defs
  timeout: 3h
